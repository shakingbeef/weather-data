<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cities — Weather</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; color: #1a202c; min-height: 100vh; padding: 2rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    nav a { text-decoration: none; padding: 0.4rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; background: #e2e8f0; color: #2d3748; }
    nav a.active { background: #4299e1; color: white; }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    p.subtitle { color: #718096; margin-bottom: 2rem; font-size: 0.95rem; }

    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 1.5rem; }
    .input-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    input[type="text"] { flex: 1; padding: 0.6rem 1rem; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem; min-width: 180px; }
    button { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: opacity .15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary   { background: #4299e1; color: white; }
    .btn-success   { background: #48bb78; color: white; }
    .btn-danger    { background: #fc8181; color: white; font-size: 0.8rem; padding: 0.3rem 0.7rem; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; }
    .btn-toggle    { background: #9f7aea; color: white; font-size: 0.8rem; padding: 0.3rem 0.8rem; }

    .status { margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2rem; }
    .status.ok  { color: #2f855a; }
    .status.err { color: #c53030; }

    /* City list */
    .city-list { display: flex; flex-direction: column; gap: 1rem; }
    .city-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden; }
    .city-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background: #ebf8ff; border-bottom: 1px solid #bee3f8; }
    .city-name { font-size: 1.1rem; font-weight: 700; color: #2b6cb0; }
    .city-actions { display: flex; gap: 0.5rem; align-items: center; }
    .city-body { padding: 1rem 1.25rem; }

    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat { background: #f7fafc; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #e2e8f0; }
    .stat-value { font-size: 1.3rem; font-weight: 700; color: #2b6cb0; }
    .stat-label { font-size: 0.7rem; color: #718096; margin-top: 0.2rem; }
    .weekly-badge { display: inline-block; background: #9f7aea; color: white; font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.4rem; vertical-align: middle; }

    /* History table */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.5rem 0.65rem; background: #edf2f7; border-bottom: 2px solid #e2e8f0; }
    td { padding: 0.5rem 0.65rem; border-bottom: 1px solid #e2e8f0; }
    tr:last-child td { border-bottom: none; }
    .rainy { color: #3182ce; }
    .sunny { color: #d69e2e; }
    .hidden { display: none; }
    .empty { color: #a0aec0; font-style: italic; font-size: 0.9rem; padding: 0.5rem 0; }
  </style>
</head>
<body>

<nav>
  <a href="/">🌤 Summary</a>
  <a href="/cities-page" class="active">🏙 My Cities</a>
</nav>

<h1>🏙 My Cities</h1>
<p class="subtitle">Track daily weather for your chosen cities.</p>

<!-- Add city -->
<div class="card">
  <div class="input-row">
    <input type="text" id="cityInput" placeholder="Add a city (e.g. Tokyo)" />
    <button class="btn-success" onclick="addCity()">+ Add City</button>
  </div>
  <div class="status" id="addStatus"></div>
</div>

<!-- City list -->
<div class="city-list" id="cityList"></div>

<script>
  const API = "";

  async function loadCities() {
    const res  = await fetch(`${API}/cities`);
    const list = await res.json();
    const container = document.getElementById("cityList");

    if (!list.length) {
      container.innerHTML = `<p class="empty">No cities tracked yet. Add one above!</p>`;
      return;
    }

    container.innerHTML = "";
    for (const city of list) {
      const card = document.createElement("div");
      card.className = "city-card";
      card.id = `card-${city}`;
      card.innerHTML = `
        <div class="city-header">
          <span class="city-name">📍 ${city}</span>
          <div class="city-actions">
            <button class="btn-success btn-sm" onclick="fetchCity('${city}')">⬇ Fetch Today</button>
            <button class="btn-toggle" onclick="toggleWeekly('${city}')">📅 Weekly Avg</button>
            <button class="btn-danger" onclick="removeCity('${city}')">✕ Remove</button>
          </div>
        </div>
        <div class="city-body" id="body-${city}">
          <p class="empty">Loading data…</p>
        </div>
      `;
      container.appendChild(card);
      renderCityData(city);
    }
  }

  async function renderCityData(city, showWeekly = false) {
    const body = document.getElementById(`body-${city}`);
    if (!body) return;

    const [histRes, weekRes] = await Promise.all([
      fetch(`${API}/weather/history?city=${encodeURIComponent(city)}`),
      showWeekly ? fetch(`${API}/weather/weekly?city=${encodeURIComponent(city)}`) : Promise.resolve(null),
    ]);

    const history = histRes.ok ? await histRes.json() : [];
    const weekly  = weekRes && weekRes.ok ? await weekRes.json() : null;

    let weeklyHtml = "";
    if (showWeekly && weekly) {
      weeklyHtml = `
        <div style="margin-bottom:1rem">
          <strong>📅 Weekly Average <span class="weekly-badge">last 7 days</span></strong>
          <div class="stats-grid" style="margin-top:0.6rem">
            <div class="stat"><div class="stat-value">${weekly.avg_morning_temp ?? "—"}°F</div><div class="stat-label">Avg Morning</div></div>
            <div class="stat"><div class="stat-value">${weekly.avg_night_temp ?? "—"}°F</div><div class="stat-label">Avg Night</div></div>
            <div class="stat"><div class="stat-value">${weekly.avg_temp_diff ?? "—"}°F</div><div class="stat-label">Avg Diff</div></div>
            <div class="stat"><div class="stat-value">${weekly.rainy_days} / ${weekly.days_recorded}</div><div class="stat-label">Rainy Days</div></div>
          </div>
        </div>
      `;
    } else if (showWeekly && !weekly) {
      weeklyHtml = `<p class="empty" style="margin-bottom:0.75rem">No data in last 7 days.</p>`;
    }

    const tableRows = history.length
      ? history.map(r => `
          <tr>
            <td>${r.date}</td>
            <td>${r.morning_temp ?? "—"}°F</td>
            <td>${r.night_temp ?? "—"}°F</td>
            <td>${r.temp_diff ?? "—"}°F</td>
            <td class="${r.is_rainy ? "rainy" : "sunny"}">${r.is_rainy ? "🌧 Yes" : "☀️ No"}</td>
          </tr>`).join("")
      : `<tr><td colspan="5" class="empty">No records yet. Click "Fetch Today" to get started.</td></tr>`;

    body.innerHTML = `
      ${weeklyHtml}
      <table>
        <thead>
          <tr><th>Date</th><th>Morning</th><th>Night</th><th>Diff</th><th>Rain</th></tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    `;

    // store current weekly state on the card
    document.getElementById(`card-${city}`).dataset.weekly = showWeekly ? "1" : "0";
  }

  async function toggleWeekly(city) {
    const card = document.getElementById(`card-${city}`);
    const current = card.dataset.weekly === "1";
    renderCityData(city, !current);
  }

  async function fetchCity(city) {
    const res  = await fetch(`${API}/weather/fetch?city=${encodeURIComponent(city)}`, { method: "POST" });
    const data = await res.json();
    if (!res.ok) {
      alert(`❌ ${data.detail || "Error fetching weather"}`);
      return;
    }
    const r = data.record;
    alert(`✅ ${r.city} — ${r.date}\nMorning: ${r.morning_temp}°F | Night: ${r.night_temp}°F | ${r.is_rainy ? "🌧 Rainy" : "☀️ Dry"}`);
    renderCityData(city, document.getElementById(`card-${city}`)?.dataset.weekly === "1");
  }

  async function addCity() {
    const input = document.getElementById("cityInput");
    const city  = input.value.trim();
    if (!city) return setAddStatus("Please enter a city name.", "err");

    setAddStatus("Adding…");
    const res  = await fetch(`${API}/cities?city=${encodeURIComponent(city)}`, { method: "POST" });
    const data = await res.json();
    if (!res.ok) return setAddStatus(`❌ ${data.detail}`, "err");

    setAddStatus(`✅ ${data.message}`, "ok");
    input.value = "";
    loadCities();
  }

  async function removeCity(city) {
    if (!confirm(`Remove ${city} from tracking?`)) return;
    await fetch(`${API}/cities?city=${encodeURIComponent(city)}`, { method: "DELETE" });
    loadCities();
  }

  function setAddStatus(msg, type = "ok") {
    const el = document.getElementById("addStatus");
    el.textContent = msg;
    el.className = "status " + type;
  }

  loadCities();
</script>
</body>
</html>
